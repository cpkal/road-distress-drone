[project]
name = "web-drone-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "geoalchemy2>=0.20.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sahi>=0.12.8",
    "sqlalchemy>=2.1.6",
    "torch",
    "torchvision",
    "ultralytics>=8.4.191",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

# CPU-only torch (AGENTS.md: YOLO on CPU). Avoids ~3 GB of CUDA wheels.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
pythonpath = [".", "api"]
